<!DOCTYPE html>
<html lang="en">
  <head>
    <title></title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <script src="index1.js" defer></script>
  </head>
  <body>
    <div id="app"></div>
    <header>Puppy Bowl</header>
    <div>
      <h3>Welcome to the puppy bowl! Below is the roster.</h3>
    </div>
    <hr />
    <div class="mainContainer">
      <div id="allPuppies"></div>
      <hr />
      <div id="singlePuppy"></div>
    </div>

    <form id="addPuppyForm">
      <label>
        Name:
        <input type="text" name="name" />
      </label>
      <label>
        <br />
        Breed:
        <input type="text" name="breed" />
      </label>
      <br />
      <label>
        Status:
        <input type="text" name="status" />
      </label>
      <br />
      <label>
        ImageURL:
        <input type="url" name="imageUrl" />
      </label>

      <br />
      <button>Submit Player</button>
    </form>
  </body>
</html>
